<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erick5544 Minecraft Server</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1c20, #23272a);
      color: #ffffff;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #2c2f33;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 550px;
      width: 100%;
      border: 2px solid #43b581;
    }
    h1 {
      margin-top: 0;
      color: #43b581;
      font-size: 2.2rem;
    }
    p {
      color: #b9bbbe;
      line-height: 1.6;
    }
    .ip-box {
      background: #23272a;
      padding: 15px;
      border-radius: 8px;
      margin: 25px 0;
      font-family: monospace;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #4f545c;
    }
    button {
      background: #43b581;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #3ca374;
    }
    .badge {
      display: inline-block;
      background: #5865F2;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    .features {
      text-align: left;
      margin-top: 20px;
      padding-left: 20px;
      color: #dcddde;
    }
    .features li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Java Edition • Version 26.3 or below</div>
    <h1>Erick5544 SMP</h1>
    <p>Welcome to our Minecraft community! Join now to build, survive, and explore together.</p>

    <div class="ip-box">
      <span id="server-ip">Erick5544.aternos.me</span>
      <button onclick="copyIP()">Copy IP</button>
    </div>
    <p id="copy-msg" style="color: #43b581; font-size: 0.9rem; height: 18px; margin-top: -15px;"></p>

    <ul class="features">
      <li>🌍 Friendly Survival Multiplayer</li>
      <li>⚡ Active Community & 24/7 Uptime</li>
      <li>🛡️ Fair Rules & Grief Protection</li>
    </ul>
  </div>

  <script>
    function copyIP() {
      const ip = document.getElementById("server-ip").innerText;
      navigator.clipboard.writeText(ip);
      const msg = document.getElementById("copy-msg");
      msg.innerText = "IP copied to clipboard!";
      setTimeout(() => { msg.innerText = ""; }, 2500);
    }
  </script>

</body>
</html>
